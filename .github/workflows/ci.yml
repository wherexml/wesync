name: CI (manual only)

# Daily checks run locally. Repository Actions are disabled by owner request.
# Retain an explicit manual/reusable entry point for a future approved release.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned audit tools
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-about --locked --features cli --version 0.9.2
      - name: Run the same checks as local development
        run: python3 scripts/local-ci.py
