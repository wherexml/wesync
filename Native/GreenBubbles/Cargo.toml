[package]
name = "greenbubbles"
version = "0.10.1"
edition = "2021"
default-run = "greenbubbles"
description = "Local-first WeChat history query, snapshot, restoration, and AI context engine"
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/bojieli/greenbubbles"
publish = false

[dependencies]
argon2 = "0.6"
base64 = "0.23"
bip39 = { version = "3.0", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
getrandom = "0.4"
hex = "0.4"
hkdf = "0.13"
libc = "0.2"
md5 = "0.8"
prost = "0.14"
rusqlite = { version = "0.41", default-features = false, features = ["backup", "bundled-sqlcipher", "cache", "hooks"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1.1"
ureq = { version = "2.12", features = ["json"] }
walkdir = "2"
zeroize = { version = "1", features = ["derive"] }
zstd = "0.14"
wx-db = { git = "https://github.com/pandorafuture/wx-cli", rev = "2abe708f55bfe135539a385df856fdc58f97fc74" }
wx-context = { git = "https://github.com/pandorafuture/wx-cli", rev = "2abe708f55bfe135539a385df856fdc58f97fc74" }
wx-decrypt = { git = "https://github.com/pandorafuture/wx-cli", rev = "2abe708f55bfe135539a385df856fdc58f97fc74" }
wx-media = { git = "https://github.com/pandorafuture/wx-cli", rev = "2abe708f55bfe135539a385df856fdc58f97fc74", features = ["audio"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }

[dev-dependencies]
filetime = "0.2"

[patch.crates-io]
# wx-cli still requests 0.40. Share the 0.41 types and one native SQLite link.
rusqlite = { path = "compat/rusqlite" }
# libsqlite3-sys 0.39.1 pins the vulnerable 4.19 source locator API.
# Use the identical API from the real SQLCipher 4.20 release.
sqlcipher-src = { path = "compat/sqlcipher-src" }
